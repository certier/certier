<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">A few things about certier</title>
  <desc id="desc">Three warm cards covering interests, tools, and current focus.</desc>
  <defs>
    <linearGradient id="lav" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7f1ff"/><stop offset="1" stop-color="#eee6fb"/></linearGradient>
    <linearGradient id="peach" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff6ef"/><stop offset="1" stop-color="#fbeadd"/></linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eff9f3"/><stop offset="1" stop-color="#e2f3e9"/></linearGradient>
  </defs>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="8" y="10" width="378" height="238" rx="24" fill="url(#lav)" stroke="#ddd1ed"/>
    <circle cx="71" cy="72" r="31" fill="#d9c9f3"/>
    <g fill="none" stroke="#6b598a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <rect x="61" y="51" width="20" height="38" rx="4"/><path d="M68 82h6"/>
      <path d="M50 104c13-8 28-8 42 0" opacity=".7"/>
    </g>
    <text x="120" y="61" fill="#7c689e" font-size="13" font-weight="700" letter-spacing="1.6">WHAT I’M INTO</text>
    <text x="120" y="91" fill="#302a3a" font-size="22" font-weight="700">Android &amp; systems</text>
    <text x="120" y="117" fill="#5c5665" font-size="16">Graphics, too — and how things work.</text>
    <path d="M32 151h330" stroke="#d8cce8"/>
    <text x="34" y="183" fill="#756294" font-size="14">Always interested in what’s possible on mobile.</text>
    <text x="34" y="216" fill="#9588a9" font-size="12" letter-spacing="1">01  /  CURIOSITY</text>

    <rect x="411" y="10" width="378" height="238" rx="24" fill="url(#peach)" stroke="#efdaca"/>
    <circle cx="474" cy="72" r="31" fill="#f2d1bd"/>
    <g fill="none" stroke="#93644f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M460 63l-10 9 10 9M488 63l10 9-10 9M480 57l-12 30"/>
    </g>
    <text x="523" y="61" fill="#9d705a" font-size="13" font-weight="700" letter-spacing="1.6">TOOLS I USE</text>
    <text x="523" y="91" fill="#302a3a" font-size="22" font-weight="700">Rust · C · Java</text>
    <text x="523" y="117" fill="#5c5665" font-size="16">Mostly learning by experimenting.</text>
    <path d="M435 151h330" stroke="#ead6c9"/>
    <text x="437" y="183" fill="#8a6352" font-size="14">Pick a question. Follow it down the rabbit hole.</text>
    <text x="437" y="216" fill="#a58a7d" font-size="12" letter-spacing="1">02  /  MAKING &amp; LEARNING</text>

    <rect x="814" y="10" width="378" height="238" rx="24" fill="url(#mint)" stroke="#d3e8d8"/>
    <circle cx="877" cy="72" r="31" fill="#cee8d5"/>
    <g fill="none" stroke="#54785d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M877 49l6 14 15 1-11 10 3 15-13-8-13 8 3-15-11-10 15-1Z"/>
      <path d="M858 103h38" opacity=".6"/>
    </g>
    <text x="926" y="61" fill="#66826c" font-size="13" font-weight="700" letter-spacing="1.6">RIGHT NOW</text>
    <text x="926" y="91" fill="#302a3a" font-size="22" font-weight="700">Focusing</text>
    <text x="926" y="117" fill="#5c5665" font-size="16">Taking things one question at a time.</text>
    <path d="M838 151h330" stroke="#d1e3d5"/>
    <text x="840" y="183" fill="#627c68" font-size="14">Still exploring, still figuring things out.</text>
    <text x="840" y="216" fill="#8da292" font-size="12" letter-spacing="1">03  /  CURRENT MOOD</text>
